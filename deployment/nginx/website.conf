# /etc/nginx/conf.d/website.conf   (RHEL)   or   /etc/nginx/sites-available/website (Ubuntu, then symlink)
# Replace example.com with your domain. Run `nginx -t` before reloading.
# Certbot (nginx plugin) adds the 443 block and the HTTP->HTTPS redirect for you.

upstream hostlab_frontend { server 127.0.0.1:3000; keepalive 16; }
upstream hostlab_backend  { server 127.0.0.1:5000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 1m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # --- Express API ---
    location /api/ {
        proxy_pass http://hostlab_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Next.js ---
    location / {
        proxy_pass http://hostlab_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
